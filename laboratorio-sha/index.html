
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHA-256</title>
  <script src="./script.js" defer></script>
</head>
<body>
  <h1>Cifragem em Hash SHA-256</h1>
  <input type="text" id="conteudo">
  <button type="button" id="enviar">Enviar</button>
  <button type="button" id="limpar">Limpar</button>
  <p>Resultado: <span id="resultado"></span></p>

  <h1>Comparar HASHES</h1>
  <form>
    <input type="text" id="hash1" placeholder="Hash 1">
    <input type="text" id="hash2" placeholder="Hash 2">
    <button type="button" id="comparar">Comparar</button>
    <p>Resultado: <span id="resultado-comparacao"></span></p>
  </form>
</body>
</html>
